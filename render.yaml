services:
  - type: web
    name: letssharelah
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: letssharelah
      - key: MONGODB_URI
        sync: false
      - key: OWNER_ACCESS_CODE
        sync: false
